apiVersion: v2
name: insustain
description: A Helm chart for Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.3.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: 1.3.0

dependencies:
  # Note: Using custom lightweight charts for MongoDB and PostgreSQL instead of Bitnami
  # Reason: Bitnami community images are now legacy (security-only), and custom charts
  # provide simpler, minimal implementations with ephemeral storage by default
  
  # - condition: prometheus.enabled
  #   name: kube-prometheus-stack
  #   repository: https://prometheus-community.github.io/helm-charts
  #   version: 69.8.0
  - condition: kepler.enabled
    name: kepler
    repository: https://sustainable-computing-io.github.io/kepler-helm-chart
    version: 0.5.13
  - condition: frontend.enabled
    name: frontend
    repository: 'file://charts/frontend'
    version: 0.1.0
  - condition: app-simulator.enabled
    name: app-simulator
    repository: 'file://charts/app-simulator'
    version: 0.1.0
  - condition: backend.enabled
    name: backend
    repository: 'file://charts/backend'
    version: 0.1.0
  - condition: mlflow.enabled
    name: mlflow
    version: "1.7.1"
    repository: "https://community-charts.github.io/helm-charts"
  - condition: mysql.enabled
    name: mysql
    version: "14.0.0"
    repository: https://charts.bitnami.com/bitnami
  - condition: sysbench.enabled
    name: sysbench
    version: 0.1.0
    repository: 'file://charts/mysqlbench'
  - condition: flask-streamer.enabled
    name: flask-streamer
    version: 0.1.0
    repository: 'file://charts/flask-streamer'
  - condition: srs-server.enabled
    name: srs-server
    version: 1.0.5
    repository: 'file://charts/srs-server'
  - condition: locust.enabled
    name: locust
    version: 0.1.0
    repository: 'file://charts/locust'
  - condition: mongodb.enabled
    name: mongodb
    version: 0.1.0
    repository: 'file://charts/mongodb'
  - condition: postgres.enabled
    name: postgres
    version: 0.1.0
    repository: 'file://charts/postgres'
  - condition: minio.enabled
    name: minio
    version: "5.4.0"
    repository: 'https://charts.min.io/'
  - condition: loadgen.enabled
    name: loadgen
    version: 0.1.0
    repository: 'file://charts/loadgen'