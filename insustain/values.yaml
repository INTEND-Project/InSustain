global:
  srs:
    http: 8080
    rtmp: 1935
    nodePort:
      rtmp: 30001
      http: 30002
  locust:
    port: 8099

backend:
  enabled: true
  service:
    backend:
      port: 8089
    jupyter:
      port: 8888
    pm:
      port: 8887
  image:
    repository: localhost:5000/insustain/backend
    tag: latest
    pullPolicy: Always
  serviceMonitor:
    enabled: true
    portName: pm  # Name of the port defined in your service
    labels:
      release: prometheus

frontend:
  enabled: false
  image:
    repository: localhost:5000/insustain/frontend
    tag: latest
    pullPolicy: Always
  backend:
    jupyter:
      port: 8888
    backend:
      port: 8089
  configmap:
    enabled: true
    name: frontend-configmap

kepler:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

mongodb:
  enabled: true
  service:
    type: ClusterIP
    port: 27017
  persistence:
    storageClassName: "mongo-pvc"

mlflow:
  enabled: true
  run:
    enabled: false
  tracking:
    persistence:
      existingClaim: "mlflow"
    service:
      type: "NodePort"
    auth:
      enabled: false
  minio:
    auth:
      rootUser: admin
      rootPassword: adminpass
    persistence:
      existingClaim: "minio"
  postgresql:
    auth:
      user: "user"
      rootPassword: "rootpass"
      password: "userpass"
    primary:
      persistence:
        existingClaim: "postgresql"

app-simulator:
  enabled: false
  image:
    repository: localhost:5000/insustain/app-simulator
    tag: latest
    pullPolicy: Always
  service:
    prom:
      port: 8008
    app:
      port: 8007
  serviceMonitor:
    enabled: true
    portName: prom  # Name of the port defined in your service
    enabled: true
    labels:
      release: prometheus

mysql:
  enabled: false
  architecrure: standalone
  primary:
    persistence:
      enabled: false
  auth:
    rootPassword: benchmark
    database: benchdb

sysbench:
  enabled: false
  image:
    repository: localhost:5000/insustain/sysbench
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  mysql:
    auth:
      rootPassword: benchmark
      database: benchdb
  workload: oltp_read_write

srs:
  enabled: true
  image:
  repository: ossrs/srs
  tag: "6"
  pullPolicy: IfNotPresent

  replicaCount: 1

  # The configuration for SRS can be overridden by environment variables.
  # See https://github.com/ossrs/srs/blob/develop/trunk/conf/full.conf
  conf:
    SRS_LOG_TANK: "console"
    SRS_LOG_LEVEL: "trace"
    SRS_HTTP_SERVER_ENABLED: "on"
    SRS_HTTP_API_ENABLED: "on"
    SRS_VHOST_HTTP_REMUX_ENABLED: "on"
    SRS_VHOST_HLS_ENABLED: "on"
    SRS_SRT_SERVER_ENABLED: "on"
    SRS_VHOST_SRT_ENABLED: "on"
    SRS_VHOST_SRT_TO_RTMP: "on"
    SRS_RTC_SERVER_ENABLED: "on"
    SRS_RTC_SERVER_CANDIDATE: "*"
    SRS_VHOST_RTC_ENABLED: "on"
    SRS_VHOST_RTC_RTMP_TO_RTC: "on"
    SRS_VHOST_RTC_RTC_TO_RTMP: "on"
    SRS_EXPORTER_ENABLED: "on"
  service:
    type: LoadBalancer
    api: 1985
    srt: 10080
    rtc: 8000
    pm: 9972
  serviceMonitor:
    enabled: true
    portName: pm  # Name of the port defined in your service
    labels:
      release: prometheus

flask-streamer:
  enabled: true
  image:
    repository: localhost:5000/insustain/flask-app
    # This sets the pull policy for images.
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: NodePort
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 5050
    nodePort: 30051
  webpath: /dev/video0
  volumeMounts:
    - name: videos
      mountPath: /app/videos
    - name: video-device
      mountPath: /dev/video0
  volumes:
    - name: videos
      hostPath:
        path: /opt/videos
        type: Directory
    - name: video-device
      hostPath:
        path: /dev/video0
        type: CharDevice
  serviceMonitor:
    enabled: true
    portName: main  # Name of the port defined in your service
    enabled: true
    labels:
      release: prometheus

locust:
  enabled: true
  image:
    repository: localhost:5000/insustain/locust
    # This sets the pull policy for images.
    pullPolicy: Always #IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest # it uses locustio/locust:2.39.
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: NodePort #it was ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    nodePort: 31098
    metricsPort: 9646