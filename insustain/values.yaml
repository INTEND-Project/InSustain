# Default values for the inSustain partner chart (generated).
#
# Images are pinned by digest on ghcr.io/intend-project. Create these Secrets in the
# release namespace before installing:
#   insustain-ghcr-pull       image pull secret for ghcr.io/intend-project
#   insustain-object-store    keys rootUser, rootPassword (object store)
#   insustain-postgres        keys username, password (PostgreSQL)
#   insustain-mongodb         keys username, password (MongoDB)
global:
  image:
    repository: ghcr.io/intend-project
    prefix: insustain-
  minio: {}
  s3:
    endpoint: http://minio.insustain.svc.cluster.local:9000
  postgresql:
    database: appdb
  monitoring:
    labels:
      release: monitoring
backend:
  enabled: true
  rbac:
    create: true
  serviceAccount:
    create: true
  mongo:
    db: monitoring
    existingSecret: insustain-mongodb
  trainingScheduler:
    enabled: false
  extraEnv: []
  service:
    type: ClusterIP
    backend:
      port: 8089
    jupyter:
      port: 8888
    pm:
      port: 8887
  image:
    digest: sha256:5df3c76289476abe4cdb48e929dc0a10bb013861b57c0fd5a3d2f6d248be3eb0
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true
    portName: pm
  imagePullSecrets:
  - name: insustain-ghcr-pull
  objectStore:
    existingSecret: insustain-object-store
frontend:
  enabled: true
  image:
    digest: sha256:81153171923d12c281d7d0b53db2a57a5b8a0758d525cacd48a94577867b5a2c
    pullPolicy: IfNotPresent
  backend:
    backend:
      port: 8089
  service:
    type: ClusterIP
    port: 3000
  imagePullSecrets:
  - name: insustain-ghcr-pull
kepler:
  enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
mongodb:
  image:
    repository: docker.io
    prefix: mongo
    tag: '8.0'
  enabled: true
  service:
    type: ClusterIP
    port: 27017
  persistence:
    enabled: true
  auth:
    existingSecret: insustain-mongodb
postgres:
  enabled: true
  postgresDb: appdb
  persistence:
    enabled: true
  existingSecret: insustain-postgres
mlflow:
  image:
    tag: 3.5.1
  log:
    enabled: true
    level: info
  backendStore:
    databaseConnectionCheck: true
    postgres:
      enabled: true
      host: postgres
      port: 5432
      database: appdb
    existingDatabaseSecret:
      name: insustain-postgres
      usernameKey: username
      passwordKey: password
  artifactRoot:
    s3:
      enabled: true
      bucket: mlflow
      existingSecret:
        name: insustain-object-store
        keyOfAccessKeyId: rootUser
        keyOfSecretAccessKey: rootPassword
  extraEnvVars:
    MLFLOW_S3_ENDPOINT_URL: http://minio.insustain.svc.cluster.local:9000
    MLFLOW_S3_IGNORE_TLS: 'true'
    MLFLOW_SERVER_ALLOWED_HOSTS: '*'
  service:
    type: ClusterIP
    port: 5000
  auth:
    enabled: false
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  mysql:
    enabled: false
    primary:
      persistence:
        enabled: false
minio:
  enabled: true
  resources:
    requests:
      memory: 1024Mi
  replicas: 1
  mode: standalone
  persistence:
    enabled: true
  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      namespace: ''
  existingSecret: insustain-object-store
  users: []
