# Default values for inSustain
# These are production-safe defaults. Credentials use placeholders that MUST
# be overridden at install time via --set flags or environment-specific values files.
#
# Usage:
#   helm install insustain ./insustain \
#     --set global.minio.rootPassword=YOUR_PASSWORD \
#     --set global.postgresql.password=YOUR_PASSWORD

global:
  image:
    repository: 89.133.95.6:5001

  minio:
    rootUser: &rootUser ""
    rootPassword: &rootPass ""

  s3:
    endpoint: &s3Endpoint http://minio.insustain.svc.cluster.local:9000

  postgresql:
    user: &postgresUser ""
    password: &postgresPassword ""
    database: &postgresDatabase "appdb"
    
  srs:
    http: 8080
    rtmp: 1935
    nodePort:
      rtmp: 30001
      http: 30002
  locust:
    port: 8099
  monitoring:
    labels:
      release: monitoring

backend:
  enabled: true
  rbac:
    create: false
  serviceAccount:
  # Specifies whether a service account should be created
    create: false
  mongo:
    db: monitoring
  service:
    backend:
      port: 8089
    jupyter:
      port: 8888
    pm:
      port: 8887
  image:
    tag: latest
    pullPolicy: Always
  serviceMonitor:
    enabled: true
    portName: pm  # Name of the port defined in your service

frontend:
  enabled: false
  image:
    repository: localhost:5000/insustain/frontend
    tag: latest
    pullPolicy: Always
  backend:
    jupyter:
      port: 8888
    backend:
      port: 8089
  configmap:
    enabled: true
    name: frontend-configmap

kepler:
  enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

mongodb:
  image:
    repository: docker.io
    prefix: mongo
    tag: "8.0"
  enabled: true
  service:
    type: ClusterIP
    port: 27017
  persistence:
    enabled: false

postgres:
  enabled: true
  postgresUser: *postgresUser
  postgresPassword: *postgresPassword
  postgresDb: *postgresDatabase
  persistence:
    enabled: false

mlflow:
  image:
    tag: 3.5.1
  
  log:
    enabled: true
    level: debug 

  backendStore:
    databaseConnectionCheck: true
    postgres:
      enabled: true
      host: "postgres"            # your PostgreSQL service name
      port: 5432
      database: *postgresDatabase
      user: *postgresUser
      password: *postgresPassword

  artifactRoot:
    s3:
      enabled: true
      bucket: "mlflow"
      awsAccessKeyId: *rootUser
      awsSecretAccessKey: *rootPass

  extraEnvVars:
    MLFLOW_S3_ENDPOINT_URL: *s3Endpoint
    MLFLOW_S3_IGNORE_TLS: "true"
    MLFLOW_SERVER_ALLOWED_HOSTS: "*"

  service:
    type: ClusterIP
    port: 5000

  auth:
    enabled: false
  
  # Disable embedded database charts - using external postgres and minio
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  
  mysql:
    enabled: false
    primary:
      persistence:
        enabled: false

app-simulator:
  enabled: false
  image:
    repository: localhost:5000/insustain/app-simulator
    tag: latest
    pullPolicy: Always
  service:
    prom:
      port: 8008
    app:
      port: 8007
  serviceMonitor:
    enabled: true
    portName: prom  # Name of the port defined in your service
    enabled: true

mysql:
  enabled: false
  architecrure: standalone
  primary:
    persistence:
      enabled: false
  auth:
    rootPassword: ""
    database: benchdb

sysbench:
  enabled: false
  image:
    repository: localhost:5000/insustain/sysbench
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  serviceMonitor:
    enabled: true

  mysql:
    auth:
      rootPassword: ""
      database: benchdb
  workload: oltp_read_write

srs-server:
  enabled: false
  image:
  repository: ossrs/srs
  tag: "6"
  pullPolicy: IfNotPresent

  replicaCount: 1

  # The configuration for SRS can be overridden by environment variables.
  # See https://github.com/ossrs/srs/blob/develop/trunk/conf/full.conf
  conf:
    SRS_LOG_TANK: "console"
    SRS_LOG_LEVEL: "trace"
    SRS_HTTP_SERVER_ENABLED: "on"
    SRS_HTTP_API_ENABLED: "on"
    SRS_VHOST_HTTP_REMUX_ENABLED: "on"
    SRS_VHOST_HLS_ENABLED: "on"
    SRS_SRT_SERVER_ENABLED: "on"
    SRS_VHOST_SRT_ENABLED: "on"
    SRS_VHOST_SRT_TO_RTMP: "on"
    SRS_RTC_SERVER_ENABLED: "on"
    SRS_RTC_SERVER_CANDIDATE: "*"
    SRS_VHOST_RTC_ENABLED: "on"
    SRS_VHOST_RTC_RTMP_TO_RTC: "on"
    SRS_VHOST_RTC_RTC_TO_RTMP: "on"
    SRS_EXPORTER_ENABLED: "on"
  service:
    type: LoadBalancer
    api: 1985
    srt: 10080
    rtc: 8000
    pm: 9972
  serviceMonitor:
    enabled: true
    portName: pm  # Name of the port defined in your service

flask-streamer:
  enabled: false
  image:
    # This sets the pull policy for images.
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: NodePort
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 5050
    nodePort: 30051
  volumeMounts:
    - name: videos
      mountPath: /app/videos
  volumes:
    - name: videos
      hostPath:
        path: /opt/videos
        type: Directory
  serviceMonitor:
    enabled: true
    portName: main  # Name of the port defined in your service
    enabled: true

minio:
  enabled: true
  resources:
    requests:
      memory: 1024Mi
  replicas: 1
  mode: standalone
  rootUser: *rootUser
  rootPassword: *rootPass
  persistence:
    enabled: false

locust:
  enabled: false
  image:
    repository: localhost:5000/insustain/locust
    # This sets the pull policy for images.
    pullPolicy: Always #IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest # it uses locustio/locust:2.39.
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: NodePort #it was ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    nodePort: 31098
    metricsPort: 9646

loadgen:
  enabled: false
  image:
    repository: localhost:5000/insustain/loadgen
    # This sets the pull policy for images.
    pullPolicy: Always #IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest # it uses locustio/locust:2.39.
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: NodePort #it was ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    nodePort: 31088
    port: 8800