apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-simulator.fullname" . }}
  labels:
    {{- include "app-simulator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.prom.port }}
      targetPort: prom
      protocol: TCP
      name: prom
    - port: {{ .Values.service.app.port }}
      targetPort: app
      protocol: TCP
      name: app
  selector:
    {{- include "app-simulator.selectorLabels" . | nindent 4 }}
