{{- if .Values.configmap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Values.configmap.name}}
data:
  default.conf: |
    # Your custom nginx configuration here
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;  # Change this to your React build folder
            index index.html;
            try_files $uri /index.html;
        }

        location /jupyter/ {
            proxy_pass http://{{.Release.Name}}-backend:{{ .Values.backend.jupyter.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "token=insustain-token";

            # Handle WebSocket connections
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /ws {
        proxy_pass http://{{.Release.Name}}-backend:{{ .Values.backend.backend.port }};  # Adjust to match your backend service
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        }

        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

    }
{{- end}}