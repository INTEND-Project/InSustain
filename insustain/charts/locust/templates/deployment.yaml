apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "locust.fullname" . }}
  labels:
    {{- include "locust.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "locust.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
         {{- include "locust.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "locust.fullImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
            - "--host={{ .Release.Name }}-srs-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.srs.rtmp }}"
            - "--web-host=0.0.0.0"
            - "--web-port={{ .Values.global.locust.port }}"
          ports:
            - name: web
              containerPort: {{ .Values.global.locust.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}

      {{- if .Values.exporter.enabled }}
        - name: locust-exporter
          image: {{ .Values.exporter.image }}
          env:
            - name: LOCUST_EXPORTER_URI
              value: {{ .Values.exporter.uri | quote }}
            - name: LOCUST_EXPORTER_TIMEOUT
              value: {{ .Values.exporter.timeout | quote }}
            - name: LOCUST_EXPORTER_WEB_LISTEN_ADDRESS
              value: {{ .Values.exporter.listenAddress | quote }}
            - name: LOCUST_EXPORTER_WEB_TELEMETRY_PATH
              value: {{ .Values.exporter.telemetryPath | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.exporter.telemetryPath }}
              port: metrics
          livenessProbe:
            httpGet:
              path: {{ .Values.exporter.telemetryPath }}
              port: metrics
      {{- end }}
