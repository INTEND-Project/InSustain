apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-streamer.fullname" . }}
  labels:
    {{ include "flask-streamer.labels" . | nindent 4}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flask-streamer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "flask-streamer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: flask-streamer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          ports:
            - name: main
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MEDIA_RTMP_SERVER
              value: "rtmp://{{ .Release.Name }}-srs-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.srs.rtmp}}"
            - name: MEDIA_BASE_SERVER
              value: "http://{{ .Release.Name }}-srs-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.srs.http}}"
            - name: LOCUST_API
              value: "http://{{ .Release.Name }}-locust.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.global.locust.port}}"
            - name: CAMERA_PATH
              value: {{ .Values.webpath }}
          volumeMounts:
{{- range .Values.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
{{- end }}
      volumes:
{{- range .Values.volumes }}
        - name: {{ .name }}
{{- if .hostPath }}
          hostPath:
            path: {{ .hostPath.path }}
            type: {{ .hostPath.type }}
{{- end }}
{{- end }}