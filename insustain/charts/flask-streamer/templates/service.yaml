apiVersion: v1
kind: Service
metadata:
  name: {{ include "flask-streamer.fullname" . }}
  labels:
    {{- include "flask-streamer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: main
      nodePort:  {{ .Values.service.nodePort }}
      name: main
      protocol: TCP
  selector:
    {{- include "flask-streamer.selectorLabels" . | nindent 4 }}
