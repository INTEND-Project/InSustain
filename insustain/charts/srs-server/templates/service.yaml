apiVersion: v1
kind: Service
metadata:
  name: {{ include "srs.fullname" . }}
  labels:
    {{- include "srs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: rtmp
      port: {{ .Values.global.srs.rtmp }}
      targetPort: {{ .Values.global.srs.rtmp }}
      nodePort: {{ .Values.global.srs.nodePort.rtmp }}
      protocol: TCP
    - name: http
      port: {{ .Values.global.srs.http }}
      targetPort: {{ .Values.global.srs.http }}
      nodePort: {{ .Values.global.srs.nodePort.http }}
      protocol: TCP 
    - name: api
      port: {{ .Values.service.api }}
      nodePort: 30003
      targetPort: {{ .Values.service.api }}
      protocol: TCP
    - name: srt
      port: {{ .Values.service.srt }}
      nodePort: 30004
      targetPort: {{ .Values.service.srt }}
      protocol: UDP
    - name: rtc
      port: {{ .Values.service.rtc }}
      nodePort: 30005
      targetPort: {{ .Values.service.rtc }}
      protocol: UDP
    - name: pm
      port: {{ .Values.service.pm }}
      nodePort: 30006
      targetPort: {{ .Values.service.pm }}
      protocol: TCP
  selector:
    {{- include "srs.selectorLabels" . | nindent 4 }}
