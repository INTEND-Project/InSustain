{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}-secret
type: Opaque
stringData:
  username: {{ .Values.auth.rootUsername | quote }}
  password: {{ required "mongodb.auth.rootPassword is required unless mongodb.auth.existingSecret names a Secret with keys username and password" .Values.auth.rootPassword | quote }}
{{- end }}