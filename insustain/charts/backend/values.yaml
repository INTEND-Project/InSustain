# Default values for backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

auth:
  enabled: false
  existingSecret: ""

reportPush:
  allowedHosts: []

prometheus:
  namespace: monitoring
  serviceName: prometheus-operated

rbac:
  create: true

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Immutable image digest (sha256:<64 lowercase hex>). When set, the image is
  # referenced as <repository>/<prefix>backend@<digest> and the tag is ignored.
  digest: ""

# Object store (MinIO/S3) credentials. Empty = literal global.minio.rootUser /
# global.minio.rootPassword values. Set to the name of an existing Secret with
# keys rootUser and rootPassword to read them from that Secret instead.
objectStore:
  existingSecret: ""

# MongoDB credentials Secret (keys username, password). Empty = the Secret the
# mongodb subchart creates, <release>-mongodb-secret.
mongo:
  existingSecret: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# GraphDB holding the intent digital twin. When a GraphDB
# is reachable, energy measurements are published there as met:Observation Turtle
# on every report; otherwise the Turtle is still generated and returned by the API
# but not pushed.
#
# Leave url empty to use the in-cluster graphdb subchart (the umbrella sets
# global.graphdb.inCluster and the deployment derives the Service address).
# Set url only to target an EXTERNAL GraphDB -- it is resolved from inside the
# pod, so it must not be a laptop-local address.
graphdb:
  url: ""
  repository: intents_and_intent_reports
  # Named graph to publish observations into (Graph Store Protocol). Empty =
  # repository default graph (legacy). Set it to the graph the intent lives in
  # so reports join it.
  graph: ""

# Background model training (ENABLE_TRAINING_SCHEDULER). Off by default. When
# on, the backend starts the periodic retraining job and, unless
# TELENOR_TRIGGER_ENABLED=false is set through extraEnv, the Telenor automatic
# collect + train tick. With it off, models are only trained through the API.
trainingScheduler:
  enabled: false

# Extra environment variables for the backend container, in Kubernetes env
# format. Use it for settings the chart does not expose as values, e.g.
# TELENOR_TRIGGER_* or LOG_LEVEL. Do not repeat a variable the chart already
# sets (MONGO_*, MLFLOW_*, PROMETHEUS_URL, GRAPHDB_*, NAMESPACE_NAME,
# ENABLE_TRAINING_SCHEDULER): duplicate names make the effective value unclear.
#   extraEnv:
#     - name: LOG_LEVEL
#       value: debug
#     - name: TELENOR_TRIGGER_PERIOD_HOURS
#       value: "6"
extraEnv: []

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
# The umbrella chart overrides this block (see insustain/values.yaml). Each
# nodePort is optional: leave it unset (or switch type to ClusterIP) and no
# nodePort field is rendered.
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  backend:
    port: 8089
  jupyter:
    port: 8888
  # Prometheus scrape port (serviceMonitor.portName below).
  pm:
    port: 8887

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: backend
  initialDelaySeconds: 30
startupProbe:
  httpGet:
    path: /healthz
    port: backend
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: backend
  initialDelaySeconds: 30

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80



nodeSelector: {}

tolerations: []

affinity: {}
