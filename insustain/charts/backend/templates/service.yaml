apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: backend
      protocol: TCP
      name: backend
    - port: {{ .Values.service.jupyter.port }}
      targetPort: jupyter
      protocol: TCP
      name: jupyter
    - port: {{ .Values.service.pm.port }}
      protocol: TCP
      name: pm
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
